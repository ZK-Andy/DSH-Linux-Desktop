name: 'Setup Node & pnpm'
description: >-
  Node 与 pnpm 的版本唯一来源：package.yml 与 patch-gate.yml 共用，升版只改这里。
  缓存不在这里做——两个工作流的缓存时机与 key 各自不同。
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24.9.0

    - uses: pnpm/action-setup@v6
      with:
        version: 11.28.5
        run_install: false
