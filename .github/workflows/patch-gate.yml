name: patch-gate

# 只做补丁门禁：静态断言 + 干净树试打 + 补丁触及的上游测试（约两分钟），不做构建、不打 rpm。
# M8 要求 patch-surface.sh 在重放补丁之前运行；这里同时把「补丁在干净上游树上试打通过」
# 一起验证，PR 2 起补丁带 preamble 后，这一步也在验证 git apply 接受 preamble。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: patch-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0：测试推导要和 base 分支比对改动了哪些补丁文件。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Check patch surface
        run: bash scripts/patch-surface.sh

      - name: Fetch upstream
        run: scripts/fetch-upstream.sh

      # 不用 --check：补丁是依次叠加的（0020 依赖 0005 新建的 .env.linux.example），
      # `git apply --check` 每条都对干净树试打，从 0020 起必然失败。这里在一次性 runner 的
      # 干净克隆上真打，效果等同打包流程里的同一步。
      - name: Apply patches
        run: scripts/apply-patches.sh

      # 补丁改到的上游测试在 CI 里真跑一遍：从本 PR 改动的补丁文件里提取它新增/修改的
      # 测试路径，交给 vitest；没有触及测试文件就跳过。node/pnpm 版本与 package.yml
      # 同源（composite action）；缓存 key 同款（lockfile 在打完补丁后取）。
      - uses: ./.github/actions/setup-node-pnpm

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('upstream/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: upstream

      - name: Collect touched upstream tests
        id: specs
        run: |
          specs=$(
            for p in $(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- patches/); do
              grep '^diff --git ' "$p" 2>/dev/null || true
            done \
            | sed 's|diff --git a/.* b/||' \
            | grep -E '(^|/)tests/.*\.spec\.tsx?$' | sort -u)
          if [ -z "$specs" ]; then
            echo "本 PR 未触及上游测试文件，跳过 vitest。"
            echo "specs=skip" >> "$GITHUB_OUTPUT"
          else
            echo "本 PR 触及的上游测试："
            echo "$specs"
            # 单行空格分隔：多行输出会在脚本展开后变成逐行命令。
            echo "specs=$(printf '%s ' $specs)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run touched upstream tests
        if: steps.specs.outputs.specs != 'skip'
        run: pnpm exec vitest run ${{ steps.specs.outputs.specs }}
        working-directory: upstream
