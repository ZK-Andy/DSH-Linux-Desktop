name: patch-gate

# PR 门禁：仓库门禁（文档、补丁形状、shell 语法、重复代码）+ 干净树真打补丁 + 补丁触及的上游测试。
# 约两三分钟，不做构建、不打 rpm——出包是 package.yml 的事。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: patch-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0：测试推导要和 base 分支比对改动了哪些补丁文件。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm

      # 仓库门禁的依赖与出包作业无关（mdast、jscpd、lefthook、typescript），所以这里单独装。
      - name: Install gate dependencies
        run: pnpm install --frozen-lockfile

      # 与 pre-push 钩子跑的是同一组门禁：文档折行与链接、Agent Note 结构与格式、字数预算、
      # 归档件哈希、技能元数据、补丁形状、shell 语法、重复代码。本地过不了，这里也过不了。
      - name: Run repository gates
        run: pnpm run check:all

      - name: Fetch upstream
        run: scripts/fetch-upstream.sh

      # 不用 --check：补丁是依次叠加的（后置补丁依赖前置补丁新建的文件），`git apply --check`
      # 每条都对干净树试打，必然有条目失败。这里在一次性 runner 的干净克隆上真打，
      # 效果等同打包流程里的同一步。
      - name: Apply patches
        run: scripts/apply-patches.sh

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('upstream/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install upstream dependencies
        run: pnpm install --frozen-lockfile
        working-directory: upstream

      # 补丁改到的上游测试在 CI 里真跑一遍：从本 PR 改动的补丁文件里提取它新增/修改的测试路径，
      # 交给 vitest；没有触及测试文件就跳过。
      - name: Collect touched upstream tests
        id: specs
        run: |
          changed=$(
            for p in $(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- patches/); do
              grep '^diff --git ' "$p" 2>/dev/null || true
            done \
            | sed 's|diff --git a/.* b/||' | sort -u)
          specs=$(printf '%s\n' "$changed" | grep -E '(^|/)tests/.*\.spec\.tsx?$' || true)
          # main.ts 的每处挂钩都改变 main 入口的启动/更新流程，由 main-startup.spec.ts 覆盖。
          if printf '%s\n' "$changed" | grep -qx 'apps/desktop/src/main.ts'; then
            specs=$(printf '%s\n%s\n' "$specs" 'apps/desktop/tests/main-startup.spec.ts')
          fi
          specs=$(printf '%s\n' "$specs" | sed '/^$/d' | sort -u)
          if [ -z "$specs" ]; then
            echo "本 PR 未触及上游测试文件，跳过 vitest。"
            echo "specs=skip" >> "$GITHUB_OUTPUT"
          else
            echo "本 PR 触及的上游测试："
            echo "$specs"
            # 单行空格分隔：多行输出会在脚本展开后变成逐行命令。
            echo "specs=$(printf '%s ' $specs)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run touched upstream tests
        if: steps.specs.outputs.specs != 'skip'
        run: pnpm exec vitest run ${{ steps.specs.outputs.specs }}
        working-directory: upstream
