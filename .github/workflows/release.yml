name: release

# 统一发布：push tag（v*）触发 → package.yml 出包 → 本文件聚合并创建单个 Release。
# 发布作业以 `needs: package` 为放行门：出包腿（含签名、静态验收、容器冒烟）任一失败都不发布。
# 手动 dispatch 分支 ref 只出包不发布（发布作业的 if 只认 tag）。
#
# Release 段与 tag 绑定：tag v0.2.2-rc.1-1 → rpm Release 1（package.yml 解析后传给 electron-builder）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    uses: ./.github/workflows/package.yml
    secrets: inherit

  release:
    needs: package
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 全量历史 + tags，供 release-notes.sh 生成 compare
          persist-credentials: false

      - name: Install rpm tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: 下载产物（同 run，经 download-artifact）
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-rpm
          path: dist


      - name: 生成合并 SHA256SUMS
        run: |
          set -euo pipefail
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z \
            | xargs -0 sha256sum | sed 's#  \./#  #') > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: 发布 preflight（资产矩阵 + 验签 + 校验和复核，任一失败终止发布）
        run: bash scripts/release-preflight.sh dist

      - name: 生成 Release 正文
        id: notes
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)"
          bash scripts/release-notes.sh "$PREV_TAG" "$GITHUB_REF_NAME" > release-body.md
          { echo "body<<BODY"; cat release-body.md; echo "BODY"; } >> "$GITHUB_OUTPUT"

      # 一律正式发布：本项目的版本号直接跟上游（当前上游只有 alpha），若按 tag 里的
      # alpha 自动标 prerelease，GitHub 就不会把它设为 Latest，仓库首页与 /releases/latest
      # 都会显示「没有 Release」。release 的 prerelease/latest 语义与上游版本措辞无关。
      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/*.rpm
            dist/RPM-GPG-KEY-dsh-desktop
            dist/SHA256SUMS.txt

  # 每次发版刷新 dnf 仓库：repodata 推到 gh-pages，rpm 本体留在本版本的 Release 里
  # （<location xml:base> 指向 releases/download/<tag>/）。不跑这步，dnf5 就会一直停在旧版本。
  #
  # 两个渠道共用同一个 rpm 与同一份 repodata，区别只在 gh-pages 的目录：
  #   /nightly/ 收所有发布（预发布只在这里；正式版也进，nightly 是 stable 的超集）
  #   /stable/  只收正式版
  #   /repodata 站点根目录，迁移期镜像（等价 nightly），给 baseurl 指根的旧版应用
  repo:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # 同组串行：两个 tag 的作业并发跑会互相覆盖/推送冲突 gh-pages，这里不取消在跑的版本。
    concurrency:
      group: gh-pages-repo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 下载产物（同 run）
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-rpm
          path: dist

      - name: 导入仓库签名密钥
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "${GPG_PRIVATE_KEY:-}" ] || { echo "::error::secrets.GPG_PRIVATE_KEY 未配置，拒绝产出未签名的 repodata"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/pass"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_PASSPHRASE_FILE=$RUNNER_TEMP/pass" >> "$GITHUB_ENV"

      - name: 判定发布渠道
        id: channel
        run: |
          set -euo pipefail
          source scripts/lib/release-channel.sh
          channel="$(release_channel_for_tag "$GITHUB_REF_NAME")"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "本版渠道：$channel（预发布只进 nightly；正式版同时进 stable 与 nightly）"

      - name: 重生成并签名 repodata（nightly）
        run: bash scripts/publish-repo.sh dist/*.rpm "$GITHUB_REF_NAME" --channel nightly --out "$RUNNER_TEMP/repo/nightly"

      - name: 重生成并签名 repodata（stable）
        if: steps.channel.outputs.channel == 'stable'
        run: bash scripts/publish-repo.sh dist/*.rpm "$GITHUB_REF_NAME" --channel stable --out "$RUNNER_TEMP/repo/stable"

      - name: 推送 repodata 到 gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          nightly="$RUNNER_TEMP/repo/nightly"
          stable="$RUNNER_TEMP/repo/stable"
          site="$RUNNER_TEMP/site"
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$site"
          # --checksum：rsync 默认只比「大小 + mtime」，新旧签名字节数相同、mtime 又可能落在同一秒，
          # 不加 --checksum 会把签名文件跳过，导致 repomd.xml 与 repomd.xml.asc 对不上（dnf 报 Bad PGP signature）。
          mkdir -p "$site/nightly/repodata"
          rsync -a --delete --checksum "$nightly/repodata/" "$site/nightly/repodata/"
          cmp "$nightly/repodata/repomd.xml.asc" "$site/nightly/repodata/repomd.xml.asc" || {
            echo "::error::nightly 的 repomd.xml.asc 没有同步到 gh-pages"; exit 1; }
          cp "$nightly/dsh-desktop.repo" "$site/dsh-desktop.repo"
          # 站点根目录是迁移期镜像（等价 nightly）：旧版应用的 .repo baseurl 指向根，换掉根
          # 会让它们停在旧版本。所有发布都刷新它，stable 版也一样进根目录。
          rsync -a --delete --checksum "$nightly/legacy-root/repodata/" "$site/repodata/"
          cmp "$nightly/legacy-root/repodata/repomd.xml.asc" "$site/repodata/repomd.xml.asc" || {
            echo "::error::根目录镜像的 repomd.xml.asc 没有同步到 gh-pages"; exit 1; }
          # 只有正式版刷新 stable 目录；nightly 发布不许覆盖 stable 的索引。
          if [[ "$CHANNEL" == "stable" ]]; then
            mkdir -p "$site/stable/repodata"
            rsync -a --delete --checksum "$stable/repodata/" "$site/stable/repodata/"
            cmp "$stable/repodata/repomd.xml.asc" "$site/stable/repodata/repomd.xml.asc" || {
              echo "::error::stable 的 repomd.xml.asc 没有同步到 gh-pages"; exit 1; }
            cp "$stable/dsh-desktop.repo" "$site/stable/dsh-desktop.repo"
          fi
          cd "$site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "repodata 无变化，跳过提交"
          else
            git commit -m "repo: ${GITHUB_REF_NAME}"
            git push origin gh-pages
          fi
