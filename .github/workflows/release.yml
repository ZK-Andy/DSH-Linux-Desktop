name: release

# 统一发布：push tag（v*）触发 → package.yml 出包 → 本文件聚合并创建单个 Release。
# 发布作业以 `needs: package` 为放行门：出包腿（含签名、静态验收、容器冒烟）任一失败都不发布。
# 手动 dispatch 分支 ref 只出包不发布（发布作业的 if 只认 tag）。
#
# Release 段与 tag 绑定：tag v0.2.2-alpha.2-2 → rpm Release 2（package.yml 解析后传给 electron-builder）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    uses: ./.github/workflows/package.yml
    secrets: inherit

  release:
    needs: package
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全量历史 + tags，供 release-notes.sh 生成 compare
          persist-credentials: false

      - name: Install rpm tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: 下载产物（同 run，经 download-artifact）
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-rpm
          path: dist

      - name: 生成 version.json（更新链读取）
        run: bash scripts/make-version-json.sh dist/*.rpm > dist/version.json && cat dist/version.json

      - name: 生成合并 SHA256SUMS
        run: |
          set -euo pipefail
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z \
            | xargs -0 sha256sum | sed 's#  \./#  #') > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: 发布 preflight（资产矩阵 + 验签 + 校验和复核，任一失败终止发布）
        run: bash scripts/release-preflight.sh dist

      - name: 生成 Release 正文
        id: notes
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)"
          bash scripts/release-notes.sh "$PREV_TAG" "$GITHUB_REF_NAME" > release-body.md
          { echo "body<<BODY"; cat release-body.md; echo "BODY"; } >> "$GITHUB_OUTPUT"

      # 一律正式发布：本项目的版本号直接跟上游（当前上游只有 alpha），若按 tag 里的
      # alpha 自动标 prerelease，GitHub 就不会把它设为 Latest，仓库首页与 /releases/latest
      # 都会显示「没有 Release」。release 的 prerelease/latest 语义与上游版本措辞无关。
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/*.rpm
            dist/RPM-GPG-KEY-dsh-desktop
            dist/version.json
            dist/SHA256SUMS.txt

  # 每次发版刷新 dnf 仓库：repodata 推到 gh-pages，rpm 本体留在本版本的 Release 里
  # （<location xml:base> 指向 releases/download/<tag>/）。不跑这步，dnf5 就会一直停在旧版本。
  repo:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 下载产物（同 run）
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-rpm
          path: dist

      - name: 导入仓库签名密钥
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "${GPG_PRIVATE_KEY:-}" ] || { echo "::error::secrets.GPG_PRIVATE_KEY 未配置，拒绝产出未签名的 repodata"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/pass"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_PASSPHRASE_FILE=$RUNNER_TEMP/pass" >> "$GITHUB_ENV"

      - name: 重生成并签名 repodata
        run: bash scripts/publish-repo.sh dist/*.rpm "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/repo"

      - name: 推送 repodata 到 gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$site"
          # --checksum：rsync 默认只比「大小 + mtime」，新旧签名字节数相同、mtime 又可能落在同一秒，
          # 不加 --checksum 会把签名文件跳过，导致 repomd.xml 与 repomd.xml.asc 对不上（dnf 报 Bad PGP signature）。
          rsync -a --delete --checksum "$RUNNER_TEMP/repo/repodata/" "$site/repodata/"
          cmp "$RUNNER_TEMP/repo/repodata/repomd.xml.asc" "$site/repodata/repomd.xml.asc" || {
            echo "::error::repomd.xml.asc 没有同步到 gh-pages"; exit 1; }
          cp "$RUNNER_TEMP/repo/dsh-desktop.repo" "$site/dsh-desktop.repo"
          cd "$site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "repodata 无变化，跳过提交"
          else
            git commit -m "repo: ${GITHUB_REF_NAME}"
            git push origin gh-pages
          fi
