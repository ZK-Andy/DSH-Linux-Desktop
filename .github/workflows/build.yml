name: build-rpm

on:
  schedule:
    # Weekly canary: follow a new upstream tag even when nobody asks.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream tag to build (defaults to the pinned tag in upstream-tag)
        required: false
        type: string

concurrency:
  group: build-rpm
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_TAG: ${{ inputs.upstream_tag || '' }}

jobs:
  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The Electron payload plus the unpacked build tree needs more room than the runner image leaves.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm xz-utils cpio
          rpmbuild --version

      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      # 缓存放在 fetch 之后：key 要用上游的 pnpm-lock.yaml，而它只有克隆完才存在。
      # 之前在 fetch 之前算 hashFiles 得到空串，key 退化成常量，缓存永远不更新。
      - name: Fetch upstream
        run: |
          if [ -n "${UPSTREAM_TAG}" ]; then
            echo "${UPSTREAM_TAG}" > upstream-tag
          fi
          scripts/fetch-upstream.sh
          echo "UPSTREAM_COMMIT=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('upstream/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      # electronDist() downloads the Electron zip on every clean runner; electron-builder also caches
      # the fpm/appimage toolchains it unpacks. Both are content-addressed by version, so keying on the
      # lockfile is enough and a stale entry only costs one miss.
      - name: Cache Electron and builder toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ hashFiles('upstream/pnpm-lock.yaml') }}
          restore-keys: |
            electron-

      - name: Apply patches
        run: scripts/apply-patches.sh

      - name: Install workspace dependencies
        working-directory: upstream
        run: |
          pnpm config set store-dir ~/.local/share/pnpm/store
          pnpm install --frozen-lockfile

      - name: Build rpm
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          DSH_DESKTOP_BUILD_COMMIT: ${{ env.UPSTREAM_COMMIT }}
          DSH_DESKTOP_BUILD_DIRTY: '0'
        run: scripts/build.sh --rpm

      - name: Verify rpm (static)
        run: |
          set -euo pipefail
          rpm=$(find upstream/apps/desktop/.desktop-build/targets/linux-x64 -name '*.rpm' | head -1)
          test -n "$rpm"
          mkdir -p dist
          cp "$rpm" dist/
          bash scripts/verify.sh "dist/$(basename "$rpm")"
          rpm -qip "$rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-rpm
          path: dist/*.rpm
          if-no-files-found: error

      # 与参考模板同形：冒烟是同一个 job 里的一个 step，rpm 腿由脚本起 fedora:44 容器。
      - name: Smoke install rpm
        run: bash scripts/smoke-install-rpm.sh dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: shots/
          if-no-files-found: warn
