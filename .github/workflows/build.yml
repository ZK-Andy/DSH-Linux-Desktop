name: build-rpm

on:
  schedule:
    # Weekly canary: follow a new upstream tag even when nobody asks.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream tag to build (defaults to the pinned tag in upstream-tag)
        required: false
        type: string

concurrency:
  group: build-rpm
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_TAG: ${{ inputs.upstream_tag || '' }}
  DSH_DESKTOP_BUILD_VERSION: 0.2.2-alpha.2

jobs:
  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The Electron payload plus the unpacked build tree needs more room than the runner image leaves.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm xz-utils
          rpmbuild --version

      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('upstream/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      # electronDist() downloads the Electron zip on every clean runner; electron-builder also caches
      # the fpm/appimage toolchains it unpacks. Both are content-addressed by version, so keying on the
      # lockfile is enough and a stale entry only costs one miss.
      - name: Cache Electron and builder toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ hashFiles('upstream/pnpm-lock.yaml') }}
          restore-keys: |
            electron-

      - name: Fetch upstream
        run: |
          if [ -n "${UPSTREAM_TAG}" ]; then
            echo "${UPSTREAM_TAG}" > upstream-tag
          fi
          scripts/fetch-upstream.sh
          echo "UPSTREAM_COMMIT=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply patches
        run: scripts/apply-patches.sh

      - name: Install workspace dependencies
        working-directory: upstream
        run: |
          pnpm config set store-dir ~/.local/share/pnpm/store
          pnpm install --frozen-lockfile

      - name: Build rpm
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          DSH_DESKTOP_BUILD_COMMIT: ${{ env.UPSTREAM_COMMIT }}
          DSH_DESKTOP_BUILD_DIRTY: '0'
        run: scripts/build.sh --rpm

      - name: Inspect rpm
        run: |
          set -euo pipefail
          rpm=$(find upstream/apps/desktop/.desktop-build/targets/linux-x64 -name '*.rpm' | head -1)
          test -n "$rpm"
          rpm -qip "$rpm"
          rpm -qp --requires "$rpm"
          rpm -qlp "$rpm" | grep -E '/usr/share/applications/|chrome-sandbox' | head
          mkdir -p dist
          cp "$rpm" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-rpm
          path: dist/*.rpm
          if-no-files-found: error

  install-smoke:
    needs: rpm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: fedora:44
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-rpm
          path: dist

      # Install the real rpm the way a user would (dnf5 resolves the explicit Requires), then add
      # just enough X11 tooling for a headless launch. Screenshot tools are best-effort: a missing
      # capture tool must not fail the job, but a crash or a missing window must.
      - name: Install rpm and X11 tools
        run: |
          dnf5 install -y --setopt=install_weak_deps=False ./dist/*.rpm
          dnf5 install -y --setopt=install_weak_deps=False \
            dbus-tools xorg-x11-server-Xvfb xorg-x11-utils ImageMagick xdotool

      - name: Launch, verify a window, screenshot
        run: |
          set -euo pipefail
          mkdir -p shots
          export DSH_HOME=/tmp/dsh-home
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" bash -c '
            set -uo pipefail
            /usr/bin/deepseek-harness --no-sandbox --disable-gpu > /tmp/app.log 2>&1 &
            app=$!
            window=""
            for _ in $(seq 1 30); do
              sleep 2
              if ! kill -0 "$app" 2>/dev/null; then
                echo "app exited before showing a window"; cat /tmp/app.log; exit 1
              fi
              window=$(xdotool search --onlyvisible --name . 2>/dev/null | head -1 || true)
              [ -n "$window" ] && break
            done
            if [ -z "$window" ]; then
              echo "no visible window after 60s"; cat /tmp/app.log; exit 1
            fi
            xdotool getwindowgeometry "$window" || true
            sleep 5
            import -window root /tmp/shot.png 2>/dev/null && [ -s /tmp/shot.png ] \
              || scrot /tmp/shot.png 2>/dev/null && [ -s /tmp/shot.png ] \
              || gnome-screenshot -f /tmp/shot.png 2>/dev/null && [ -s /tmp/shot.png ] \
              || echo "screenshot unavailable (best-effort)"
            kill "$app" 2>/dev/null || true
            cp /tmp/shot.png /tmp/shots/shot.png 2>/dev/null || true
          '
          cp shots/shot.png shots/ 2>/dev/null || true
          ls -la shots || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: shots/
          if-no-files-found: warn
